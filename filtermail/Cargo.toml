[package]
name = "filtermail"
version = "0.6.1"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["Chatmail Developers"]
description = "A mail filtering service used by chatmail relay"
repository = "https://github.com/chatmail/filtermail"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serini = "0.2.2"
tokio = { version = "1.51.0", features = ["full"] }
thiserror = "2.0.18"
mailparse = "0.16.1"
log = "0.4.29"
env_logger = "0.11.10"
governor = "0.10.4"
viadkim = { version = "0.2.0" }
hickory-resolver = { version = "0.25.2", features = ["dnssec-ring"] }
lru = "0.16.3"
parking_lot = "0.12.5"
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
webpki-roots = "1.0.6"
tokio-io-timeout = "1.2.1"

[dev-dependencies]
rstest = "0.26.1"
testresult = "0.4.1"

[profile.release]
lto = "thin"
