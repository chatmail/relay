[package]
name = "filtermail"
version = "0.7.1"
edition = "2024"
license = "MIT"
readme = "README.md"
authors = ["Chatmail Developers"]
description = "A mail filtering service used by chatmail relay"
repository = "https://github.com/chatmail/filtermail"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serini = "0.2.2"
tokio = { version = "1.52.3", features = ["full"] }
thiserror = "2.0.18"
mailparse = "0.16.1"
memchr = "2.8.1"
log = "0.4.30"
env_logger = "0.11.10"
governor = { version = "0.10.4", default-features = false, features = [
  "std",
  "dashmap",
] }
viadkim = { version = "0.2.0" }
hickory-resolver = { version = "0.26.1", features = ["dnssec-aws-lc-rs"] }
lru = "0.18.0"
parking_lot = "0.12.5"
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "aws-lc-rs",
  "logging",
  "tls12",
] }
webpki-roots = "1.0.7"
tokio-io-timeout = "1.2.1"
retainer = "0.4.0"
hyper = { version = "1.8.1", features = ["server"] }
hyper-util = { version = "0.1.20", features = [
  "tokio",
  "server",
  "server-auto",
  "client-legacy",
] }
http-body-util = "0.1.3"
hyper-rustls = { version = "0.27.9", default-features = false, features = [
  "aws-lc-rs",
  "http1",
  "http2",
  "logging",
  "tls12",
] }

[dev-dependencies]
rstest = "0.26.1"
testresult = "0.4.1"

[profile.release]
lto = "thin"
